load_module /etc/nginx/modules/ngx_http_ssl_ja3_module.so;
load_module /etc/nginx/modules/ngx_stream_ssl_ja3_preread_module.so;
load_module /etc/nginx/modules/ndk_http_module.so;  # assuming NDK is built as a dynamic module too
load_module /etc/nginx/modules/ngx_http_lua_module.so;

user  www-data;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {

    #lua_package_path "/lua/lib/?.lua;;";
     lua_package_path "/lua/lib/?.lua;;";
    lua_need_request_body on;
    log_by_lua_file /lua/logger.lua;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
daemon off;